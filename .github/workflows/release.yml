name: Desktop Release

on:
  push:
    branches:
      - agent/runnable-mvp
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"
  WAILS_VERSION: "v2.13.0"
  RELEASE_TAG: "v0.1.0"

jobs:
  macos:
    name: Build macOS universal app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Download Go modules
        run: go mod download
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build universal macOS app
        run: wails build -clean -platform darwin/universal
      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - build/bin/BTaskAssistant.app
      - name: Package app
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/BTaskAssistant.app \
            release/BTaskAssistant-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BTaskAssistant-macOS-universal
          path: release/BTaskAssistant-macOS-universal.zip
          if-no-files-found: error

  windows:
    name: Build Windows x64 app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Download Go modules
        run: go mod download
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${env:WAILS_VERSION}
      - name: Build Windows app
        run: wails build -clean -platform windows/amd64
      - name: Package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive `
            -Path build/bin/BTaskAssistant.exe `
            -DestinationPath release/BTaskAssistant-Windows-x64.zip `
            -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BTaskAssistant-Windows-x64
          path: release/BTaskAssistant-Windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "BTaskAssistant v0.1.0 MVP" \
              --notes-file docs/RELEASE_NOTES_v0.1.0.md \
              --prerelease
          fi
